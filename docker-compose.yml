# One image, three ways to run it.
#
#   docker compose up -d                          production — what the server runs
#   docker compose --profile local up preview     http://localhost:8137/  (image)
#   docker compose --profile local up dev         http://localhost:8138/  (working tree)
#
# The bare `up` starts only `diercki`: it publishes no port and is reached by the
# host's Caddy over the shared external `web` network. That matters — Docker's
# published ports write their own iptables rules and bypass UFW, so a port opened
# here would be open to the internet regardless of the firewall role.
#
# The two preview services sit behind the `local` profile and therefore never start
# on the server: the deploy runs a plain `up`, and Compose skips profiled services.
#
# File name: docker-compose.yml, not compose.yaml. The bmeise `dockerapp` role injects
# its web-network attachment as docker-compose.override.yml, and Compose only merges
# an override whose name matches the base file's family.

services:
  diercki:
    build: .
    image: sternprodukt/diercke-atlas:latest
    restart: unless-stopped

  preview:
    profiles: ["local"]
    build: .
    image: sternprodukt/diercke-atlas:latest
    ports:
      - "8137:80"

  dev:
    profiles: ["local"]
    build: .
    image: sternprodukt/diercke-atlas:latest
    ports:
      - "8138:80"
    volumes:
      # Read-only: the preview shows the working tree, it does not write to it.
      # The application reads on every request, so an edit on disk is live — no
      # restart, no build step.
      #
      # /gems and /opt/vendor stay in the image, outside this mount: the gems are
      # built for Alpine and the nine vendored libraries must be there even
      # without a network. BUNDLE_APP_CONFIG in the Dockerfile keeps the host's
      # .bundle/config from redirecting the gem path into the mount.
      - .:/srv:ro
