# Sternprodukt atlas — static delivery and local preview.
#
# Two jobs: serve the repo tree, and put the landing page at /. The map sheets are
# NOT modified — they belong to the design project and must stay byte-comparable for
# the sync. Their CDN references are rewritten on the way out instead, onto the
# libraries the image carries.

server {
  # IPv6 explicitly: the image's 10-listen-on-ipv6-by-default.sh only patches the
  # packaged default.conf and skips ours. Without it, `localhost` inside the
  # container resolves to ::1 first (see /etc/hosts) and every connection is
  # refused — which is what made the HEALTHCHECK report unhealthy.
  listen 80;
  listen [::]:80;
  server_name _;
  root /srv;

  charset utf-8;
  charset_types text/css application/javascript application/json text/csv text/plain;

  # No `types` block here on purpose: it would REPLACE nginx's default table, not
  # extend it — .html would fall back to octet-stream, and with it sub_filter below
  # would stop matching. The few extra types this tree needs (geojson, csv, md, …)
  # are appended to /etc/nginx/mime.types in the Dockerfile instead.
  default_type application/octet-stream;

  # The landing page lives in web/, not at the root — the root belongs to the design
  # project. Its own references are absolute (/web/, /atlas/), so they resolve the
  # same whether the page is reached as / or as /web/index.html.
  location = / {
    try_files /web/index.html =404;
  }

  # Vendored libraries instead of CDN. Downloaded at build time, byte-identical —
  # which is why the integrity hashes in the sheets still validate.
  #
  # They live OUTSIDE the document root on purpose. The dev service bind-mounts the
  # working tree read-only onto /srv, and Docker cannot create a nested mountpoint
  # inside a read-only mount — anything under /srv/vendor would fail the container.
  #
  # `^~` matters: without it the regex location below (\.js$ …) would win for
  # /vendor/…/d3.min.js and serve it from the document root instead.
  location ^~ /vendor/ {
    alias /opt/vendor/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # No directory listing in normal operation: the tree carries working material
  # that is not on display.
  autoindex off;

  # One deliberate exception. The page has to know which sheets actually exist in
  # the root — otherwise a sheet missing from the README table could not be shown
  # as an open case and would silently disappear. Same for the source registers and
  # the research notes. Serves JSON, not the HTML listing.
  location /_index/ {
    alias /srv/;
    autoindex on;
    autoindex_format json;
    autoindex_exact_size off;
  }

  location / {
    # sub_filter rewrites the response body, not the file on disk. That is why it
    # works the same for the tree baked into the image and for a read-only bind
    # mount of the working tree in the dev preview. (text/html is always in
    # sub_filter_types; naming it earns a "duplicate MIME type" warning.)
    #
    # Exact URLs, not a host prefix. A prefix rule would rewrite ANY unpkg URL —
    # so bumping d3 to 7.10 upstream would produce /vendor/unpkg/d3@7.10/… which
    # is not in the image, and the sheet would break with a 404. Matching the nine
    # vendored URLs exactly means an unvendored version keeps loading from the CDN:
    # it degrades to the status quo instead of failing. Same protection for a
    # source note that cites a CDN URL in an href — it stays a working citation.
    #
    # Serving these ourselves is not only about offline preview: it keeps visitors'
    # IP addresses from going to third parties, and it freezes deutschlandGeoJSON@main,
    # which is a moving target that could otherwise change under a finished sheet.
    sub_filter_once  off;
    sub_filter 'https://unpkg.com/d3@7.9.0/dist/d3.min.js'
               '/vendor/unpkg/d3@7.9.0/dist/d3.min.js';
    sub_filter 'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'
               '/vendor/unpkg/topojson-client@3.1.0/dist/topojson-client.min.js';
    sub_filter 'https://unpkg.com/react@18.3.1/umd/react.production.min.js'
               '/vendor/unpkg/react@18.3.1/umd/react.production.min.js';
    sub_filter 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'
               '/vendor/unpkg/react-dom@18.3.1/umd/react-dom.production.min.js';
    sub_filter 'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js'
               '/vendor/unpkg/@babel/standalone@7.24.7/babel.min.js';
    sub_filter 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js'
               '/vendor/unpkg/@babel/standalone@7.29.0/babel.min.js';
    sub_filter 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json'
               '/vendor/jsdelivr/npm/world-atlas@2.0.2/countries-50m.json';
    sub_filter 'https://cdn.jsdelivr.net/gh/isellsoap/deutschlandGeoJSON@main/2_bundeslaender/3_mittel.geo.json'
               '/vendor/jsdelivr/gh/isellsoap/deutschlandGeoJSON@main/2_bundeslaender/3_mittel.geo.json';
    sub_filter 'https://cdn.jsdelivr.net/gh/isellsoap/deutschlandGeoJSON@main/4_kreise/4_niedrig.geo.json'
               '/vendor/jsdelivr/gh/isellsoap/deutschlandGeoJSON@main/4_kreise/4_niedrig.geo.json';

    try_files $uri $uri/ =404;
  }

  # The sheets are work in progress and change often; only the vendored libraries
  # above are held long.
  location ~* \.(html|css|js|csv|geojson|geojsonl|dat|md)$ {
    expires -1;
    add_header Cache-Control "no-cache";

    sub_filter_once  off;
    sub_filter 'https://unpkg.com/d3@7.9.0/dist/d3.min.js'
               '/vendor/unpkg/d3@7.9.0/dist/d3.min.js';
    sub_filter 'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'
               '/vendor/unpkg/topojson-client@3.1.0/dist/topojson-client.min.js';
    sub_filter 'https://unpkg.com/react@18.3.1/umd/react.production.min.js'
               '/vendor/unpkg/react@18.3.1/umd/react.production.min.js';
    sub_filter 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'
               '/vendor/unpkg/react-dom@18.3.1/umd/react-dom.production.min.js';
    sub_filter 'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js'
               '/vendor/unpkg/@babel/standalone@7.24.7/babel.min.js';
    sub_filter 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js'
               '/vendor/unpkg/@babel/standalone@7.29.0/babel.min.js';
    sub_filter 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json'
               '/vendor/jsdelivr/npm/world-atlas@2.0.2/countries-50m.json';
    sub_filter 'https://cdn.jsdelivr.net/gh/isellsoap/deutschlandGeoJSON@main/2_bundeslaender/3_mittel.geo.json'
               '/vendor/jsdelivr/gh/isellsoap/deutschlandGeoJSON@main/2_bundeslaender/3_mittel.geo.json';
    sub_filter 'https://cdn.jsdelivr.net/gh/isellsoap/deutschlandGeoJSON@main/4_kreise/4_niedrig.geo.json'
               '/vendor/jsdelivr/gh/isellsoap/deutschlandGeoJSON@main/4_kreise/4_niedrig.geo.json';
  }

  gzip on;
  # text/html is always compressed — listing it earns a duplicate-type warning.
  gzip_types text/css application/javascript application/json
             application/geo+json text/csv text/plain image/svg+xml;
  gzip_min_length 1024;
}
