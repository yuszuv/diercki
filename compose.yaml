# Two services on the same image.
#
#   docker compose up atlas   delivery — tree comes from the image
#   docker compose up dev     preview — working tree bind-mounted, edits to sheets
#                             and data are visible on reload
#
# Both run without network access: the libraries sit in the image under /srv/vendor,
# and nginx rewrites the sheets' CDN references onto them.

services:
  atlas:
    build: .
    image: sternprodukt/diercke-atlas:latest
    ports:
      - "8137:80"
    restart: unless-stopped

  dev:
    build: .
    image: sternprodukt/diercke-atlas:latest
    ports:
      - "8138:80"
    volumes:
      # Read-only: the preview shows the working tree, it does not write to it.
      - .:/srv:ro
      # Anonymous volume keeps /srv/vendor from the image visible under the mount,
      # so the preview stays offline-capable.
      - /srv/vendor
